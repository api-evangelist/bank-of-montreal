actions:
  openapiHarvested: false
  reason: >-
    No publicly downloadable OpenAPI/Swagger exists; specs and the interactive
    API Explorer are gated behind an approved organization account. Identity and
    the documented (but partner-gated) API surface were captured; nothing was
    fabricated and no spec was placed in openapi/.
