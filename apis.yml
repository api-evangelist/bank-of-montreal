apis:
- aid: bank-of-montreal:bmo-account-information-api
  name: BMO Account Information API
  description: >-
    Real-time access to BMO Online Banking for Business account data — current
    balances; day-end, month-end and year-end balances; and transaction
    histories that can replace BAI files and other settlement reports — surfaced
    directly inside accounting and treasury-management systems.
  humanURL: https://developer.bmo.com/api/commercial/product
  baseURL: https://api.bmo.com
  tags:
