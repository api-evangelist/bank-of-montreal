name: BMO Financial Group
kind: company
description: >-
  BMO Financial Group (Bank of Montreal) is one of Canada's Big Six banks and a
  Schedule I domestic chartered bank, founded in Montreal in 1817 as Canada's
  oldest bank. It is a diversified North American financial-services provider
  serving personal, commercial, wealth, and capital-markets clients across
  Canada and the United States (where it operates as the separately chartered
  BMO Bank N.A.). BMO runs a first-party, bilingual (EN/FR) commercial developer
  portal at developer.bmo.com for Online Banking for Business customers,
  publishing OAuth 2.0-secured Account Information, Account Validation, Image
  Retrieval, Payment (domestic and international / embedded finance), Authorize,
  and Encryption APIs on an IBM API Connect platform with a free sandbox and
  pre-production environment. Documentation and OpenAPI/API Explorer specs sit
  behind an approved organization account, so the surface is partner-gated
  rather than openly downloadable. Canada has no operational open-banking
  mandate yet — the federal Consumer-Driven Banking framework (Budget 2024 /
  Fall Economic Statement 2024, overseen by the FCAC) is legislated but not live
  — so consumer data access today remains voluntary and largely aggregator-based
  (Flinks, Plaid), while BMO's own public program is a commercial treasury/
  payments API offering.
