  - type: APIReference
    url: https://developer.bmo.com/api/commercial/product
- aid: bank-of-montreal:bmo-encryption-api
  name: BMO Encryption API
  description: >-
    Protects data by encrypting all requests to and responses from BMO APIs.
    Encryption is required for all Payment APIs as well as for fields shared via
    the Account Validation API.
