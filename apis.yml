  - type: APIReference
    url: https://developer.bmo.com/api/commercial/product
- aid: bank-of-montreal:bmo-account-validation-api
  name: BMO Account Validation API
  description: >-
    Validates third-party accounts before a transaction is created, reducing
    failed or misdirected payments. Selected fields shared via the Account
    Validation API must be protected using the Encryption API.
  humanURL: https://developer.bmo.com/api/commercial/product
  baseURL: https://api.bmo.com
  tags:
  - Account Validation
  - Payments
  - Verification
  properties:
  - type: Documentation
    url: https://developer.bmo.com/api/commercial/faq
  - type: APIReference
    url: https://developer.bmo.com/api/commercial/product
- aid: bank-of-montreal:bmo-image-retrieval-api
  name: BMO Image Retrieval API
  description: >-
    Retrieves images of deposited cheques and other items associated with BMO
    Online Banking for Business accounts, so clients can pull supporting item
    images without signing in to online banking.
  humanURL: https://developer.bmo.com/api/commercial/product
  baseURL: https://api.bmo.com
  tags:
  - Image Retrieval
  - Cheque Images
  - Reporting
  properties:
  - type: Documentation
    url: https://developer.bmo.com/api/commercial/faq
  - type: APIReference
    url: https://developer.bmo.com/api/commercial/product
- aid: bank-of-montreal:bmo-payment-api
  name: BMO Payment API
  description: >-
    Sends and collects domestic and international payments directly from a
    client's application, with account validation before payment creation and
    real-time payment-status updates delivered by API, email, or text. Launched
    as part of BMO's North American embedded-finance payments program (Dec 2025)
    for ERP, treasury, and customer-facing platforms.
  humanURL: https://developer.bmo.com/api/commercial/product
  baseURL: https://api.bmo.com
  tags:
  - Payments
  - Domestic Payments
  - International Payments
  - Embedded Finance
  properties:
  - type: Documentation
    url: https://developer.bmo.com/api/commercial/faq
  - type: APIReference
    url: https://developer.bmo.com/api/commercial/product
- aid: bank-of-montreal:bmo-authorize-api
  name: BMO Authorize API
  description: >-
    Authenticates and authorizes applications to access BMO APIs using the
    industry-standard OAuth 2.0 framework, issuing the access tokens required to
    call the Account Information, Account Validation, Image Retrieval, and
    Payment APIs across sandbox, pre-production, and production environments.
  humanURL: https://developer.bmo.com/api/commercial/product
  baseURL: https://api.bmo.com
