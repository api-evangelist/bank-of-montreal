schemes:
- name: OAuth2
  type: oauth2
  description: >-
    OAuth 2.0 access tokens issued by the BMO Authorize API grant applications
    access to the Account Information, Account Validation, Image Retrieval, and
    Payment APIs across sandbox, pre-production, and production environments.
  flows:
  - flow: authorizationCode
    authorizationUrl: https://api.bmo.com/aac/sps/oauth/oauth20/authorize
    tokenUrl: https://api.bmo.com/aac/sps/oauth/oauth20/token
  - flow: jwt-bearer
    grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
    tokenUrl: https://api.bmo.com/aac/sps/oauth/oauth20/token
  sources: [well-known/bank-of-montreal-openid-configuration.json]
- name: OpenIDConnect
  type: openIdConnect
  openIdConnectUrl: https://api.bmo.com/.well-known/openid-configuration
  issuer: https://api.bmo.com
  provider: IBM Security Verify (VerifymeOIDC)
  userinfo_endpoint: https://api.bmo.com/aac/sps/oauth/oauth20/userinfo
  jwks_uri: https://api.bmo.com/aac/sps/oauth/oauth20/jwks/VerifymeOIDC
  introspection_endpoint: https://api.bmo.com/aac/sps/oauth/oauth20/introspect
  revocation_endpoint: https://api.bmo.com/aac/sps/oauth/oauth20/revoke
  id_token_signing_alg_values_supported: [RS256]
  response_types_supported: [code, none]
  grant_types_supported: [urn:ietf:params:oauth:grant-type:jwt-bearer, authorization_code]
  sources: [well-known/bank-of-montreal-openid-configuration.json]
- name: Encryption
  type: message-encryption
  description: >-
    The BMO Encryption API encrypts all requests to and responses from BMO APIs;
    encryption is mandatory for the Payment APIs and for fields shared via the
    Account Validation API. This is an application-layer requirement on top of
    OAuth 2.0 transport auth.
  sources: [https://developer.bmo.com/api/commercial/product]
